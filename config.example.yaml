# Copy to config.yaml and edit.  ${ENV_VARS} are expanded, so secrets can live
# in your environment instead of this file.

poll_interval_seconds: 120   # time between full scans (keep >= 120 to avoid blocks)
jitter_seconds: 45
request_delay_seconds: 4     # pause between individual searches
db_path: flipwatch.db
alert_on_first_run: false    # first scan only records existing listings

deals:
  fixed_costs: 500           # registration/plates, detailing, oil change, small fixes, gas
  purchase_tax_pct: 0.0      # Alberta: no sales tax on private used-car sales
  min_profit: 1000           # default for every watch
  min_roi: 0.15              # profit / (price + tax + fixed_costs)
  min_price: 500             # ignore "$1" / "$123" placeholder prices
  # Used by watches with `market_value: auto`:
  auto_resale_pct: 0.90      # assume you resell at 90% of the median asking price
  auto_min_comps: 5          # need this many comparable listings before alerting
  auto_comp_days: 30
  auto_year_window: 1        # compare a 2014 against 2013-2015 listings
  # exclude: / signals: override the built-in word lists (see flipwatch/config.py)

kijiji:
  enabled: true
  # From a Kijiji cars search URL for your area, e.g.
  # https://www.kijiji.ca/b-cars-trucks/calgary/civic/k0c174l1700199
  # (open a Calgary search on kijiji.ca and check the number after "l" matches)
  location_slug: calgary
  location_id: 1700199
  category_slug: cars-trucks
  category_id: 174

facebook:
  enabled: true              # run `python -m flipwatch fb-login` once first
  location: calgary          # facebook.com/marketplace/<location>/
  radius_km: 60              # covers Airdrie, Cochrane, Chestermere, Okotoks
  days_since_listed: 1
  headless: true

notify:
  console: true
  ntfy_topic: ${NTFY_TOPIC}          # phone push via the ntfy app - pick a hard-to-guess topic
  # discord_webhook: ${DISCORD_WEBHOOK}
  # telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
  # telegram_chat_id: ${TELEGRAM_CHAT_ID}

# Each watch = what to search + how to value it.  Three ways to value a car:
#   market_value: auto                         median asking price of similar listings
#                                              flipwatch has seen (+/- 1 model year).
#                                              Easiest when you're starting out.
#   market_value_by_year: {2014: 8500, ...}   your own numbers once you know a model
#   market_value: 9000                         one number for the whole year range
# Don't set max_price on `auto` watches - it would hide the pricier listings the
# median is built from.  Leave queries empty ("") to scan every new car listing.
watches:
  # --- Hondas ---
  - name: Honda Civic
    queries: ["honda civic"]
    min_year: 2008
    max_km: 250000
    market_value: auto
    exclude: [type r, si, hybrid]   # different market - give them their own watch

  - name: Honda Accord
    queries: ["honda accord"]
    min_year: 2008
    max_km: 250000
    market_value: auto
    exclude: [hybrid]

  - name: Honda CR-V
    queries: ["honda crv", "honda cr-v"]
    match_query_terms: false
    require_all: [honda]
    require_any: [crv, cr-v, "cr v"]
    min_year: 2007
    max_km: 260000
    market_value: auto

  # --- Toyotas ---
  - name: Toyota Corolla
    queries: ["toyota corolla"]
    min_year: 2008
    max_km: 260000
    market_value: auto

  - name: Toyota Camry
    queries: ["toyota camry"]
    min_year: 2008
    max_km: 260000
    market_value: auto
    exclude: [hybrid]

  - name: Toyota RAV4
    queries: ["toyota rav4"]
    min_year: 2007
    max_km: 260000
    market_value: auto
    exclude: [hybrid]

  # --- Anything else that looks like a flip ---
  - name: Cheap Honda/Toyota (any model)
    queries: ["honda", "toyota"]
    max_price: 5000
    min_year: 2005

  - name: Any car - motivated seller
    queries: [""]                   # every new car listing in the area
    max_price: 6000
    require_any: [as is, as-is, must go, must sell, moving, quick sale, need gone, obo,
                  needs battery, check engine, mechanic special, needs tlc, estate]
